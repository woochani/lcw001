<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 지도서비스 탑재하기</title>
    <style>
        *{margin: 0; padding: 0;}
        body{background-color: beige;}
        #map{width: 80%; height: 500px; margin: 50px auto; border: 2px solid #ccc;}
    </style>
</head>
<body>
        <!-- 지도를 표시할 div 입니다 -->
    <div id="map"></div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9448382a6db2004561c05884dd792f77"></script>
    <script>
        var mapContainer = document.getElementById('map'), // 지도를 표시할 div 
            mapOption = { 
                center: new kakao.maps.LatLng(36.328741, 127.422939), // 지도의 중심좌표
                level: 3 // 지도의 확대 레벨
            };

        // 지도 생성
        var map = new kakao.maps.Map(mapContainer, mapOption); 

        // 마커 이미지 설정
        var imageSrc = 'http://lcw1997.dothome.co.kr/marker.png', 
            imageSize = new kakao.maps.Size(127, 73),
            imageOption = {offset: new kakao.maps.Point(63, 73)}; // 마커 이미지의 기준점 조정

        var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption),
            markerPosition = new kakao.maps.LatLng(36.328741, 127.422939); // 마커 위치

        // 마커 생성 및 지도에 추가
        var marker = new kakao.maps.Marker({
            position: markerPosition, 
            image: markerImage 
        });

        marker.setMap(map); // 마커 지도에 표시
        
        // 아래 코드는 지도 위의 마커를 제거하는 코드입니다
        // marker.setMap(null);
    </script>
</body>
</html>
