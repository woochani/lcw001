<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animate 1</title>
    <style>
        div{width: 300px; height: 200px; background-color: blue;
            position: absolute; left: 30px; top: 30px;}
        button{width: 150px; height: 30px; margin-top: 250px;}
    </style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function(){
                $('button').on('mouseenter', function(){
                    $('div').stop().animate({
                    top: 200, left: 500
                    }, 1000, 'swing', function(){
                    $(this).animate({
                        top: 30, left: 30
                    });
                });
            });           
        });
    </script>
</head>
<body>
    <div>box1</div>
    <button>Play</button>
</body>
</html>
